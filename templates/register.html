<!DOCTYPE html>

<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='CSS/register_page.css') }}">
    </head>
    <body>
            <h2>Register</h2>
            <form method = "POST" action ="/submit_register">
                
                <label>Username:</label>
                <input type="text"  name="username">

                <br>
                <br>

                <label >Password:</label>
                <input type ="text"  name="password">

                <br>
                <br>

                <label >First Name:</label>
                <input type ="text"  name="first_name">

                <br>
                <br>

                <label >Last Name:</label>
                <input type ="text"  name="last_name">

                <br>
                <br>

                 <label>Gender:</label>
                <input type ="radio"  name="gender" value="male">
                Male
                </label>

                <label >
                <input type ="radio"  name="gender" value="female">
                Female
                </label>

                <br>
                <br>

                <label>Date of birth:</label>
                <input type ="number"  name="day"  min="0"  max="31" placeholder ="day">
                <input type ="number"  name="month"  min="1"  max="12" placeholder ="month">
                <input type ="number"  name="year"  min="1900"  max="2026" placeholder ="year">

                <br>
                <br>

                <label> Email: </label>
                <input type="text"  name="email">

                <br>
                <br>

                <label> Phone number: </label>
                <input type="text"  name="phone_number">

                <br>
                <br>

                <label >Are you a doctor?</label>
                <input type ="checkbox"  name="is_doctor">

                <br>
                <br>

                <button type ="submit">Submit</button>
            </form>
            
            {% for message in get_flashed_messages() %}
                <p>{{message}}</p>
            {% endfor %}
                 

            
    </body>

</html>
