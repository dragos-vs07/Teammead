<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='CSS/edit_consultation_page.css') }}">
        <title>Teammed</title>
    </head>
    <body>
            <h2>Edit consultation </h2>
        
            <br>
            <br>
         
            <form method ="POST" action ="/change_consultation/{{c.id}}" enctype="multipart/form-data">

                            <label >Weight:</label>
                            <input type ="number"  name="weight" value = {{c.weight}}>

                            <br>
                            <br>

                            <label>Diagnostic:</label>
                            <input type ="text"  name="diagnostic" value = {{c.diagnostic}}>

                            <br>
                            <br>

                            <label>Date:</label>
                            <input type ="number"  name="day"  min="0"  max="31" placeholder ="day" value = {{c.consultation_date.day}}>
                            <input type ="number"  name="month"  min="1"  max="12" placeholder ="month" value = {{c.consultation_date.month}}>
                            <input type ="number"  name="year"  min="1900"  max="2026" placeholder ="year" value = {{c.consultation_date.year}}>

                            <br>
                            <br>

                            <label >Health state:</label>
                            <input type ="number"  name="health_state" min = 0 max = 10  value = {{c.health_state}}>

                            <br>
                            <br>

                            <button type ="submit">Submit</button>

            </form>
            {% for message in get_flashed_messages() %}
                <p>{{message}}</p>
            {% endfor %}
    </body>

</html>
