<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='CSS/patient_stats_page.css') }}">
        <title>Teammed</title>
    </head>
    <body>

            <div class ="content">

                    {% include "sidebar.html" %}

                    <div class ="charts_area">

                        <div class ="filter_box">
                            <select name="timerange" id="timerange">
                                <option value="-1">All time</option>
                                <option value="365">Last year</option>
                                <option value="180">Last 6 months</option>
                                <option value="90">Last 3 months</option>
                                <option value="30">Last month</option>
                                <option value="7">Last week</option>
                            </select>
                        </div>
                        <div></div> 
                        
                        <!-- charts  -->

                        
                            {% set vars = [ "health_state" , "weight" , "blood_pressure_systolic" ,
                            "blood_pressure_diastolic" ,"heart_rate" , "blood_oxygen_saturation"]  %}

                            {% for v in vars %}
                                <div class = "chart" id = "{{v}}_chart"></div>
                                <div class = "chart_stats_box" id = "extremes_{{v}}"> 

                                    <div class ="min_max_box">
                                        <strong><p class ="mean_tag">Max</p></strong>
                                        <div class ="max_item" id = "max_{{v}}"><strong> stats[{{v}}]['max'] </strong></div>
                                    </div>

                                    <div class ="mean_box" id="mean_box_{{v}}">
                                        <strong> <p class ="mean_tag"> Mean </p> </strong>
                                        <div class ="mean_item" id="mean_{{v}}"> <strong> stats[{{v}}]['mean'] </strong> </div>
                                    </div>

                                    <div class ="min_max_box">
                                        <strong><p class ="mean_tag">Min</p></strong>
                                        <div class ="min_item" id = "min_{{v}}"><strong> stats[{{v}}]['min'] </strong></div>
                                    </div>
                                </div>
                            {% endfor %}
                        
            </div>
                 
            <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
            <script> const consultations_list = {{ consultations | tojson | safe }};</script>
            <script src = "{{ url_for('static' , filename = 'JavaScript/patient_stats_page.js') }}"></script>

    </body>

</html>
