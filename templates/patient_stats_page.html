<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='CSS/patient_stats_page.css') }}">
        <title>Teammed</title>
    </head>
    <body>

        

            <div class ="content">

                    <div class = "sidebar">
                        <div class ="logo">
                            <span class="second_half">Team</span><span class="third_half">med</span>
                        </div>

                        <br>
                        <br>

                            <button class="sidebar_button" onclick="window.location.href='/patient_stats_page'">
                                Statistics
                            </button>
                        
                        <br>
                        <br>

                            <button class="sidebar_button" onclick="window.location.href='/patient_appointments_page'">
                                Appointments
                            </button>

                        <br>
                        <br>

                            <button class="sidebar_button" onclick="window.location.href='/patient_consultations_page'">
                                Consultations
                            </button>
                        
                        <br>
                        <br>

                            <button class="sidebar_button"  onclick="window.location.href='/edit_account'">
                                Edit Account
                            </button>

                            <button onclick = "logout_user()" class="sidebar_button" id="logout_button">Log out</button>

                    </div>

                    <div class ="charts_area">

                        <div class ="filter_box">
                            <select name="timerange" id="timerange">
                                <option value="-1">All time</option>
                                <option value="365">Last year</option>
                                <option value="180">Last 6 months</option>
                                <option value="90">Last 3 months</option>
                                <option value="30">Last month</option>
                                <option value="7">Last week</option>
                            </select>
                        </div>

                        <div class="chart" id="health_state_chart"></div>
                        
                        <div class="chart" id="weight_chart"></div>
                         
                        <div class="chart" id="blood_pressure_systolic_chart"></div>
                         
                        <div class="chart" id="blood_pressure_diastolic_chart"></div>
                         
                        <div class="chart" id="heart_rate_chart"></div>
                         
                        <div class="chart" id="blood_oxygen_saturation_chart"></div>
                         

                    </div>
                
                 </div>
                 
                    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
                    <script> const consultations_list = {{ consultations | tojson | safe }};</script>
                    <script src = "{{ url_for('static' , filename = 'JavaScript/patient_stats_page.js') }}"></script>
            
           

    </body>

</html>
